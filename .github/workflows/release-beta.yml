name: Build and publish beta downloads

on:
  push:
    branches: [main]
    paths:
      - file-organiser-pro/**
      - packaging/**
      - .github/workflows/release-beta.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-organiser-beta
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libtk8.6
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Test the app on Windows and Mac
        if: runner.os != 'Linux'
        working-directory: file-organiser-pro
        run: python -m unittest discover -s tests -v
      - name: Test the app on Linux
        if: runner.os == 'Linux'
        working-directory: file-organiser-pro
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Build and test the packaged app
        run: python packaging/build.py
      - name: Upload native package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FileOrganiserPro-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish beta release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: FileOrganiserPro-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified downloads as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python packaging/publish_release.py
